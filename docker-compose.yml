services:
  # FastAPI Application
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql+asyncpg://topomon:topomon@db:5432/topomon
      - REDIS_URL=redis://redis:6379
      - APP_DEBUG=true
      - TZ=Asia/Taipei
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8080 --reload
    networks:
      - topomon_net
    restart: unless-stopped

  # SNMP Collector Service - 使用 host 網路以訪問外部 SNMP 設備
  #
  # network_mode: host 也是 trap 接收能用的前提：收 trap 要綁 udp/162，
  # 而且來源位址必須是設備的管理位址才會被採用 —— 經過 NAT 的 bridge 網路
  # 會把來源位址換掉，那樣每一個 trap 都會被當成「不是受管設備」丟掉。
  collector:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://topomon:topomon@localhost:5432/topomon
      - REDIS_URL=redis://localhost:6379
      - TZ=Asia/Taipei
      # 盤點間隔與快迴圈間隔，見 docs/PERFORMANCE.md 第 20 節
      - COLLECTOR_INTERVAL=300
      - COLLECTOR_FAST_INTERVAL=60
      # 收 linkDown/linkUp。要用的話設備端也要把 trap 目的地指到這台，
      # 而且這個容器需要能綁 udp/162（host 網路 + root 時沒問題）。
      # 來源位址不必是管理位址：盤點會記下每台設備自己回報的位址
      # （COLLECTOR_DEVICE_ADDRESSES），所以從出口介面送的 trap 也認得出來，
      # 不用在每台設備加 snmp-server trap-source。見 docs/CONFIGURATION.md
      # 第 5.3 節，收不到的判讀在 5.4 節。
      - COLLECTOR_TRAP_ENABLED=false
      - COLLECTOR_TRAP_PORT=162
      # 走訪每台設備自己的 IP 位址表（見上）。那次走訪是一次輪詢的約 5%
      # CPU，而每台設備最多每 COLLECTOR_ADDRESS_INTERVAL 秒走訪一次，所以
      # 預設下平均每輪只付 1/12（見 docs/PERFORMANCE.md 第 38 節）。
      # 不收 trap 的部署可以整個關掉。分片時每一片都要開，因為拿到 udp/162
      # 的那一片需要其他片輪詢的設備的位址。
      - COLLECTOR_DEVICE_ADDRESSES=true
      # 同一台設備的位址最多多久問一次。位址是慢變數，所以預設一小時而不是
      # 每輪；代價是「設備多一個位址」之後最多約一小時才被 trap 認得（新設備
      # 不受影響，第一次輪詢就問）。0 = 每輪都問。
      - COLLECTOR_ADDRESS_INTERVAL=3600
      # 分片：一個行程負責 devices.id % COLLECTOR_SHARDS == COLLECTOR_SHARD_ID
      # 的設備。1 就是單一行程、完全不做分片協調（見 docs/PERFORMANCE.md
      # 第 24 節）。要加第二片的話，下面 collector-2 取消註解，**並且**把
      # 這裡的 COLLECTOR_SHARDS 一起改成 2 —— 兩邊的數字必須一致，否則
      # 會有設備被漏掉或被兩個行程重複輪詢。
      - COLLECTOR_SHARDS=1
      - COLLECTOR_SHARD_ID=0
      # 告警抑制。預設值＝原本的行為（第一次沒回應就判離線、不做 flap
      # 抑制、trap 立刻告警）。要用「晚一點但確定」換掉「掉包一次就叫人
      # 起床」就調這三個，見 docs/PERFORMANCE.md 第 28 節。
      # 分片時每台設備只有一個主人、告警檢查只有一個行程在做，所以這些
      # 狀態留在行程內就夠，不需要每片設成一樣（但設成一樣比較好懂）。
      - ALERT_OFFLINE_CONFIRM_CYCLES=1
      - ALERT_LINK_FLAP_TRANSITIONS=0
      - ALERT_LINK_FLAP_WINDOW=600
      - ALERT_TRAP_REQUIRES_POLL=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
    command: python -m app.collector
    network_mode: host
    extra_hosts:
      - "db:127.0.0.1"
      - "redis:127.0.0.1"
    restart: unless-stopped

  # 第二個分片。要用的時候取消註解，並把上面 collector 的
  # COLLECTOR_SHARDS 也改成 2。
  #
  # 三件事要注意：
  #   * COLLECTOR_TRAP_ENABLED 只能有一個行程是 true：udp/162 一台主機只有
  #     一個行程綁得到。綁到的那一個會處理整個機群的 trap，不只自己那一片。
  #   * 合併線路與告警檢查由「拿到 fleet-wide lease」的那一個行程做，不是
  #     每一片都做。誰拿到是搶的，所以掛掉的那一個會被接手。
  #   * 資料庫連線數會跟著行程數成長：實測一片 20 條、兩片 28 條、四片 81
  #     條（COLLECTOR_CONCURRENT=20）。PostgreSQL 預設 max_connections=100，
  #     四片以上要調大，或把 COLLECTOR_CONCURRENT 調小。
  #
  # collector-2:
  #   build: .
  #   environment:
  #     - DATABASE_URL=postgresql+asyncpg://topomon:topomon@localhost:5432/topomon
  #     - REDIS_URL=redis://localhost:6379
  #     - TZ=Asia/Taipei
  #     - COLLECTOR_INTERVAL=300
  #     - COLLECTOR_FAST_INTERVAL=60
  #     - COLLECTOR_TRAP_ENABLED=false
  #     - COLLECTOR_DEVICE_ADDRESSES=true
  #     - COLLECTOR_SHARDS=2
  #     - COLLECTOR_SHARD_ID=1
  #     - ALERT_OFFLINE_CONFIRM_CYCLES=1
  #     - ALERT_LINK_FLAP_TRANSITIONS=0
  #     - ALERT_LINK_FLAP_WINDOW=600
  #     - ALERT_TRAP_REQUIRES_POLL=false
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   volumes:
  #     - .:/app
  #     - /etc/localtime:/etc/localtime:ro
  #   command: python -m app.collector
  #   network_mode: host
  #   extra_hosts:
  #     - "db:127.0.0.1"
  #     - "redis:127.0.0.1"
  #   restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=topomon
      - POSTGRES_PASSWORD=topomon
      - POSTGRES_DB=topomon
      - TZ=Asia/Taipei
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U topomon" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - topomon_net
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    environment:
      - TZ=Asia/Taipei
    volumes:
      - redisdata:/data
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "6379:6379"
    networks:
      - topomon_net
    restart: unless-stopped

networks:
  topomon_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
