services:
  # 反向代理 —— 唯一對外的入口，也是整個系統的認證（deploy/nginx.conf 說明
  # 為什麼認證在這裡）。憑證與 htpasswd 由 `mf-topomon-docker deploy` 產生在 auth/。
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "${TOPOMON_HTTP_PORT:-80}:80"
      - "${TOPOMON_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./auth:/etc/nginx/auth:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      # 代理在啟動時就解析 app 的位址，所以要等它真的在聽
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - topomon_net
    restart: unless-stopped

  # FastAPI Application
  #
  # 只綁 127.0.0.1：繞過代理（也就是繞過認證）要先登入這台主機。要從外面看
  # 8080 是刻意做不到的事，不是忘了開。
  app:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DATABASE_URL=postgresql+asyncpg://topomon:${POSTGRES_PASSWORD:-topomon}@db:5432/topomon
      - REDIS_URL=redis://redis:6379
      - TZ=Asia/Taipei
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
    # --proxy-headers：日誌與錯誤訊息要看到真正的客戶端位址，而不是代理容器
    # 的。--forwarded-allow-ips 給 *，因為這個行程只有代理與 127.0.0.1 連得到
    # （上面的 ports），所以沒有別人能偽造那個標頭。
    #
    # 沒有 --reload：那是開發用的，它會多一個監看行程，而且改到一半的檔案會
    # 讓它在半路重啟。要更新程式碼用 `mf-topomon-docker update`。
    command: >-
      uvicorn app.main:app --host 0.0.0.0 --port 8080
      --proxy-headers --forwarded-allow-ips=*
    healthcheck:
      # python 一定在這個映像裡，所以不必為了健康檢查裝 curl
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - topomon_net
    restart: unless-stopped

  # SNMP Collector Service - 使用 host 網路以訪問外部 SNMP 設備
  #
  # network_mode: host 也是 trap 接收能用的前提：收 trap 要綁 udp/162，
  # 而且來源位址必須是設備的管理位址才會被採用 —— 經過 NAT 的 bridge 網路
  # 會把來源位址換掉，那樣每一個 trap 都會被當成「不是受管設備」丟掉。
  collector:
    build: .
    environment:
      - DATABASE_URL=postgresql+asyncpg://topomon:${POSTGRES_PASSWORD:-topomon}@localhost:5432/topomon
      - REDIS_URL=redis://localhost:6379
      - TZ=Asia/Taipei
      # 盤點間隔與快迴圈間隔，見 docs/PERFORMANCE.md 第 20 節
      - COLLECTOR_INTERVAL=300
      - COLLECTOR_FAST_INTERVAL=60
      # 收 linkDown/linkUp。要用的話設備端也要把 trap 目的地指到這台，
      # 而且這個容器需要能綁 udp/162（host 網路 + root 時沒問題）。
      # 來源位址不必是管理位址：盤點會記下每台設備自己回報的位址
      # （COLLECTOR_DEVICE_ADDRESSES），所以從出口介面送的 trap 也認得出來，
      # 不用在每台設備加 snmp-server trap-source。見 docs/CONFIGURATION.md
      # 第 5.3 節，收不到的判讀在 5.4 節。
      - COLLECTOR_TRAP_ENABLED=false
      - COLLECTOR_TRAP_PORT=162
      # 走訪每台設備自己的 IP 位址表（見上）。那次走訪是一次輪詢的約 5%
      # CPU，而每台設備最多每 COLLECTOR_ADDRESS_INTERVAL 秒走訪一次，所以
      # 預設下平均每輪只付 1/12（見 docs/PERFORMANCE.md 第 38 節）。
      # 不收 trap 的部署可以整個關掉。分片時每一片都要開，因為拿到 udp/162
      # 的那一片需要其他片輪詢的設備的位址。
      - COLLECTOR_DEVICE_ADDRESSES=true
      # 同一台設備的位址最多多久問一次。位址是慢變數，所以預設一小時而不是
      # 每輪；代價是「設備多一個位址」之後最多約一小時才被 trap 認得（新設備
      # 不受影響，第一次輪詢就問）。0 = 每輪都問。
      - COLLECTOR_ADDRESS_INTERVAL=3600
      # 分片：一個行程負責 devices.id % COLLECTOR_SHARDS == COLLECTOR_SHARD_ID
      # 的設備。1 就是單一行程、完全不做分片協調（見 docs/PERFORMANCE.md
      # 第 24 節）。要加第二片的話，下面 collector-2 取消註解，**並且**把
      # 這裡的 COLLECTOR_SHARDS 一起改成 2 —— 兩邊的數字必須一致，否則
      # 會有設備被漏掉或被兩個行程重複輪詢。
      - COLLECTOR_SHARDS=1
      - COLLECTOR_SHARD_ID=0
      # 告警抑制。預設值＝原本的行為（第一次沒回應就判離線、不做 flap
      # 抑制、trap 立刻告警）。要用「晚一點但確定」換掉「掉包一次就叫人
      # 起床」就調這三個，見 docs/PERFORMANCE.md 第 28 節。
      # 分片時每台設備只有一個主人、告警檢查只有一個行程在做，所以這些
      # 狀態留在行程內就夠，不需要每片設成一樣（但設成一樣比較好懂）。
      - ALERT_OFFLINE_CONFIRM_CYCLES=1
      - ALERT_LINK_FLAP_TRANSITIONS=0
      - ALERT_LINK_FLAP_WINDOW=600
      - ALERT_TRAP_REQUIRES_POLL=false
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - .:/app
      - /etc/localtime:/etc/localtime:ro
    command: python -m app.collector
    network_mode: host
    extra_hosts:
      - "db:127.0.0.1"
      - "redis:127.0.0.1"
    restart: unless-stopped

  # 第二個分片。要用的時候取消註解，並把上面 collector 的
  # COLLECTOR_SHARDS 也改成 2。
  #
  # 三件事要注意：
  #   * COLLECTOR_TRAP_ENABLED 只能有一個行程是 true：udp/162 一台主機只有
  #     一個行程綁得到。綁到的那一個會處理整個機群的 trap，不只自己那一片。
  #   * 合併線路與告警檢查由「拿到 fleet-wide lease」的那一個行程做，不是
  #     每一片都做。誰拿到是搶的，所以掛掉的那一個會被接手。
  #   * 資料庫連線數會跟著行程數成長：實測一片 20 條、兩片 28 條、四片 81
  #     條（COLLECTOR_CONCURRENT=20）。PostgreSQL 預設 max_connections=100，
  #     四片以上要調大，或把 COLLECTOR_CONCURRENT 調小。
  #
  # collector-2:
  #   build: .
  #   environment:
  #     - DATABASE_URL=postgresql+asyncpg://topomon:${POSTGRES_PASSWORD:-topomon}@localhost:5432/topomon
  #     - REDIS_URL=redis://localhost:6379
  #     - TZ=Asia/Taipei
  #     - COLLECTOR_INTERVAL=300
  #     - COLLECTOR_FAST_INTERVAL=60
  #     - COLLECTOR_TRAP_ENABLED=false
  #     - COLLECTOR_DEVICE_ADDRESSES=true
  #     - COLLECTOR_SHARDS=2
  #     - COLLECTOR_SHARD_ID=1
  #     - ALERT_OFFLINE_CONFIRM_CYCLES=1
  #     - ALERT_LINK_FLAP_TRANSITIONS=0
  #     - ALERT_LINK_FLAP_WINDOW=600
  #     - ALERT_TRAP_REQUIRES_POLL=false
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #   volumes:
  #     - .:/app
  #     - /etc/localtime:/etc/localtime:ro
  #   command: python -m app.collector
  #   network_mode: host
  #   extra_hosts:
  #     - "db:127.0.0.1"
  #     - "redis:127.0.0.1"
  #   restart: unless-stopped

  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=topomon
      # 預設值是舊部署用的那一個，所以升級不會把既有的 pgdata 鎖在外面。
      # 新安裝時 `mf-topomon-docker deploy` 會在 .env 裡放一組隨機密碼。
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-topomon}
      - POSTGRES_DB=topomon
      - TZ=Asia/Taipei
    volumes:
      - pgdata:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    # 只綁 127.0.0.1。collector 走 host 網路，所以它仍然連得到 localhost:5432，
    # 但網路上的其他人連不到 —— 資料庫裡有每一台設備的 community。
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U topomon" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - topomon_net
    restart: unless-stopped

  # Redis
  redis:
    image: redis:7-alpine
    environment:
      - TZ=Asia/Taipei
    volumes:
      - redisdata:/data
      - /etc/localtime:/etc/localtime:ro
    # 同樣只綁 127.0.0.1。Redis 預設沒有密碼，開在網路上等於開一個無認證的
    # 鍵值庫。（目前程式還沒在用它，見 docs/PERFORMANCE.md 第 42 節第 1 項。）
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - topomon_net
    restart: unless-stopped

networks:
  topomon_net:
    driver: bridge

volumes:
  pgdata:
  redisdata:
