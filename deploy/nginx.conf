# mf-topomon 的反向代理 —— 這個檔案就是目前整個系統的認證。
#
# 為什麼認證在這裡，而不在應用程式裡：這個專案沒有使用者的概念，也刻意不發明
# 一套。它要保護的東西是「誰連得到這個管理介面」—— 因為 API 讀得到每一台設備
# 的 SNMP community（明文），改得動設備清單，也關得掉告警。這種保護用一層
# HTTP basic auth 就夠，而把它放在代理上，意思是應用程式不管怎麼改都不會把
# 這一層弄丟。
#
# 三條規則：
#   1. app 容器只綁在 127.0.0.1（docker-compose.yml），所以**唯一**的入口是
#      這個代理。繞過它要先登入主機。
#   2. /health 與 /health/ready 不要認證：負載平衡器的探測、容器自己的
#      healthcheck、以及 `mf-topomon doctor` 都走這兩條，而它們只回「服務本身活
#      著嗎、資料庫連得上嗎」，沒有任何一台設備的資料。
#   3. 其他全部要認證，包含 /docs（FastAPI 的互動式文件可以直接打 API）。
#
# 憑證是自己簽的（安裝時產生）。自簽憑證瀏覽器會警告，但 basic auth
# 的密碼是 base64 而不是加密，走明文 HTTP 等於把管理密碼送上線路 —— 自簽
# 至少讓竊聽拿不到密碼。要換成真憑證：覆蓋 auth/tls.crt 與 auth/tls.key，
# 然後重新載入 nginx（docs/DEPLOYMENT.md）。

# 這個檔案同時是 Docker 部署掛進 nginx 容器的設定，以及原生安裝寫進主機
# nginx 的站台（scripts/mf-topomon.sh render-nginx 會把上游位址、憑證目錄
# 與埠換成那台主機的）。兩邊用同一份，所以被測試的就是被部署的。
upstream topomon_app {
    server app:8080;
    # 連線重用：每個請求都重開一條 TCP 對 uvicorn 是沒必要的成本
    keepalive 16;
}

# 共用的代理標頭。uvicorn 以 --proxy-headers 啟動（docker-compose.yml），所以
# 日誌與限流看到的是真正的客戶端位址，而不是代理容器的位址。
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_set_header Connection "";

# 手動發現（POST /api/v1/discovery/manual）是同步的：一台 seed 加上它的鄰居，
# 每一台最多 SNMP_TIMEOUT × (SNMP_RETRIES+1)。預設值下 20 個鄰居就會超過
# nginx 預設的 60 秒，而逾時在瀏覽器上看起來會像「發現失敗」。
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# 這個介面不收上傳，2m 只是留給 settings 的 JSON 有餘裕
client_max_body_size 2m;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # 探測走 HTTP 也要通：不是每個負載平衡器都願意對自簽憑證做 TLS
    location = /health {
        access_log off;
        proxy_pass http://topomon_app;
    }

    # 其他一律上 TLS。密碼在這之後才會被問，所以不會有「先明文送一次」的情況
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/auth/tls.crt;
    ssl_certificate_key /etc/nginx/auth/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 10m;

    # 這個介面只該從管理網段看得到，所以不要被搜尋引擎或 iframe 碰到
    add_header X-Frame-Options       DENY               always;
    add_header X-Content-Type-Options nosniff           always;
    add_header Referrer-Policy       same-origin        always;

    location = /health {
        access_log off;
        proxy_pass http://topomon_app;
    }

    location = /health/ready {
        access_log off;
        proxy_pass http://topomon_app;
    }

    location / {
        auth_basic           "topomon";
        auth_basic_user_file /etc/nginx/auth/htpasswd;
        proxy_pass           http://topomon_app;
    }
}
