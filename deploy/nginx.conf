# mf-topomon 的反向代理：TLS，以及「唯一的入口」。
#
# 登入不在這裡。以前整個系統的認證是這個檔案裡的一組 HTTP basic auth 密碼；
# 現在帳號、角色、AD 登入都在應用程式裡（app/core/security_middleware.py），
# 因為「誰改了什麼」「誰可以改」只有應用程式答得出來。這個代理仍然守著兩件事：
#
#   1. app 只綁在 127.0.0.1（systemd 單元、docker-compose.yml），所以**唯一**
#      的入口是這裡。繞過它要先登入主機。
#   2. 所有東西都走 TLS：80 一律轉到 443（/health 例外，給不做 TLS 的負載平衡
#      器）。登入表單送的是密碼，session cookie 是登入之後的鑰匙，兩者都不該
#      出現在明文的線路上 —— 應用程式在 HTTPS 上會把 cookie 設成 Secure。
#
# 沒登入的請求由應用程式回 401（API）或轉到 /login（頁面）；這一點由
# tests/test_proxy_auth.py 用真的 nginx 跑這份設定檢查。
#
# 憑證預設是自己簽的（安裝時產生），換成真憑證：後台「HTTPS 憑證」上傳，或
# 覆蓋 auth/tls.crt 與 auth/tls.key 再重新載入 nginx（docs/DEPLOYMENT.md）。

# 這個檔案同時是 Docker 部署掛進 nginx 容器的設定，以及原生安裝寫進主機
# nginx 的站台（scripts/mf-topomon.sh render-nginx 會把上游位址、憑證目錄
# 與埠換成那台主機的）。兩邊用同一份，所以被測試的就是被部署的。
upstream topomon_app {
    server app:8080;
    # 連線重用：每個請求都重開一條 TCP 對 uvicorn 是沒必要的成本
    keepalive 16;
}

# 共用的代理標頭。uvicorn 以 --proxy-headers 啟動（docker-compose.yml），所以
# 日誌與限流看到的是真正的客戶端位址，而不是代理容器的位址。
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_http_version 1.1;
proxy_set_header Connection "";

# 手動發現（POST /api/v1/discovery/manual）是同步的：一台 seed 加上它的鄰居，
# 每一台最多 SNMP_TIMEOUT × (SNMP_RETRIES+1)。預設值下 20 個鄰居就會超過
# nginx 預設的 60 秒，而逾時在瀏覽器上看起來會像「發現失敗」。
proxy_read_timeout 300s;
proxy_send_timeout 300s;

# 最大的上傳是後台的 HTTPS 憑證（三個 PEM 檔，各最多 256 KB）
client_max_body_size 2m;

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;

    # 探測走 HTTP 也要通：不是每個負載平衡器都願意對自簽憑證做 TLS
    location = /health {
        access_log off;
        proxy_pass http://topomon_app;
    }

    # 其他一律上 TLS。登入頁在這之後才出現，所以密碼不會有「先明文送一次」的情況
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/auth/tls.crt;
    ssl_certificate_key /etc/nginx/auth/tls.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:1m;
    ssl_session_timeout 10m;

    # 這個介面只該從管理網段看得到，所以不要被搜尋引擎或 iframe 碰到
    add_header X-Frame-Options       DENY               always;
    add_header X-Content-Type-Options nosniff           always;
    add_header Referrer-Policy       same-origin        always;

    location = /health {
        access_log off;
        proxy_pass http://topomon_app;
    }

    location = /health/ready {
        access_log off;
        proxy_pass http://topomon_app;
    }

    # 登入、角色與 CSRF 由應用程式檢查（每一個請求，包含 /docs）
    location / {
        proxy_pass http://topomon_app;
    }
}
