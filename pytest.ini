[pytest]
testpaths = tests
# The SNMP tests skip rather than fail when SNMPSIM_BIN is unset (see
# tests/README.md), so a bare `pytest` on a machine without the simulator
# still runs every pure-logic test.
addopts = -q
filterwarnings =
    # pysnmp 6.x calls its own deprecated camelCase helpers while walking, so
    # a real walk prints a dozen of these. They are the library's, not ours.
    ignore:.*is deprecated. Please use.*:DeprecationWarning
    ignore:.*class-based `config` is deprecated.*:DeprecationWarning
